<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보 게임</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
      background: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    .buttons {
      margin: 30px 0;
    }

    button {
      font-size: 20px;
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #4caf50;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    .result {
      font-size: 24px;
      margin-top: 30px;
      color: #222;
    }

    .score {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <h1>✌️ 가위바위보 게임 ✊</h1>

  <div class="buttons">
    <button onclick="play('가위')">✌️ 가위</button>
    <button onclick="play('바위')">✊ 바위</button>
    <button onclick="play('보')">🖐️ 보</button>
  </div>

  <div class="result" id="result">버튼을 눌러 시작하세요!</div>
  <div class="score" id="score">
    승: 0 | 패: 0 | 무: 0
  </div>

  <script>
    const choices = ['가위', '바위', '보'];

    let win = 0;
    let lose = 0;
    let draw = 0;

    function play(user) {
      const computer =
        choices[Math.floor(Math.random() * choices.length)];

      let result = '';

      if (user === computer) {
        result = '무승부!';
        draw++;
      } else if (
        (user === '가위' && computer === '보') ||
        (user === '바위' && computer === '가위') ||
        (user === '보' && computer === '바위')
      ) {
        result = '승리!';
        win++;
      } else {
        result = '패배!';
        lose++;
      }

      document.getElementById('result').innerHTML =
        `당신: ${user} <br> 컴퓨터: ${computer} <br><strong>${result}</strong>`;

      document.getElementById('score').innerText =
        `승: ${win} | 패: ${lose} | 무: ${draw}`;
    }
  </script>
</body>
</html>
